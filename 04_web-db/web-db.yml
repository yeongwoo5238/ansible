---
################################
    # Play 1 - 웹-PHP-DB 구현
    # 1. WEB Server + Firewall 설정
    # 1) 패키지 설치
    # 2) 서비스 설정
    # 3) 서비스 기동
    # 4) 방화벽 포트 등록
    # 2. DB Server 설정
    # 1) 패키지 설치
    # 2) 서비스 기동
    # 3) 서비스 설정
    # 4) 방화벽 포트 등록
    - name: 1. Play 01 - WEB-PHP-DB 구현
      hosts: webservers
      tasks:
        # 1. WEB Server + Firewall
        - name: 1) 패키지 설치 - httpd, mod_ssl, php, php-mysqlnd, php-pdo, firewalld
          ansible.builtin.dnf:
            name:
              - httpd
              - mod_ssl
              - php
              - php-mysqlnd
              - php-pdo
              - firewalld
            state: present

        - name: 2) 서비스 설정 - /var/www/html/index.php 
          ansible.builtin.get_url:
            url: http://192.168.10.10/index.php.txt
            dest: /var/www/html/index.php
            mode: '0644'
       
        - name: 3) 서비스 기동 - httpd, firewalld
          ansible.builtin.service:
            name: "{{ item }}"
            state: started
            enabled: true
          loop:
            - httpd
            - firewalld
        
        - name: 4) 방화벽 등록 - http, https
          ansible.posix.firewalld:
            service: "{{ item }}"
            permanent: true
            immediate: true
            state: enabled
          loop:
            - http
            - https

     # 1) 패키지 설치
     # 2) 서비스 설정
     # 3) 서비스 기동
     # 4) 방화벽 포트 등록


    # 2. DB Server 설정
    # 1) 패키지 설치
    # * DB 패키지: mariadb-server, mariadb
        - name: 1)패키지 설치 - mariadb-server, mariadb
          ansible.builtin.dnf:
            name: 
             - mariadb-server
             - mariadb
             - python3-PyMySQL
            state: latest
    # 2) 서비스 기동
    # * mariadb.service
        - name: Enable service httpd and ensure it is >
          ansible.builtin.systemd_service:
            name: mariadb
            enabled: true
            state: started

    # 3) 서비스 설정
    # * mysql_secure_installation
    # * 사용자추가/권한부여
        - name: Case insensitive password string match
          become: true
          ansible.builtin.expect:
            command: /usr/bin/mysql_secure_installation
            responses:
              'Enter current password for root': ''
              'Switch to unix_socket authentication': 'Y'
              'Change the root password?': 'Y'
              'New password': 'soldesk1.'
              'Re-enter new password': 'soldesk1.'
              'Remove anonymous users': 'Y'
              'Disallow root login remotely': 'Y'
              'Remove test database and access to it': 'Y'
              'Reload privilege tables now': 'Y'
            timeout: 1
            
        - name: 3) 서비스 설정 - 사용자/권한 추가
          become: true
          ansible.mysql.mysql_user:
            login_user: root
            login_password: soldesk1.
            name: soldesk
            password: soldesk1.
            priv: '*.*:ALL'
            state: present      
        
          
        # 4) 방화벽 포트 등록
        # * mysql
        - name: 4) 방화벽 포트 등록 - mysql
          ansible.posix.firewalld:
            service: mysql
            permanent: true
            immediate: true
            state: enabled
    
#    
# Play 2 - 확인
#
#    1) 웹 요청
    - name: 0) 웹서버에 요청
      hosts: localhost
      tasks:
        - name: 1) web1 웹서버에 웹요청 확인
          ansible.builtin.uri:
           url: "http://192.168.10.11/index.php"
           #method: GET
           status_code: 200
 