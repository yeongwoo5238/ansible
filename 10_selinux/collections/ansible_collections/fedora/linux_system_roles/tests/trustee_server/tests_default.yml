---
- name: Ensure that the role runs with default parameters
  hosts: all
  tasks:
    - name: See if /dev/log exists for the fingerprint check
      ansible.builtin.stat:
        path: /dev/log
      register: __register_dev_log

    - name: Set the start time for the journal search
      ansible.builtin.set_fact:
        __journal_start_time: "{{ ansible_facts['date_time']['date'] ~ ' ' ~ ansible_facts['date_time']['time'] }}"
      when: __register_dev_log.stat.exists

    - name: Run tests
      block:
        - name: Include trustee_server role
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            __trustee_server_write_log_file: true
            __sr_public: true

        - name: Get fingerprint entries from journal
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: >-
              set -eo pipefail;
              journalctl --since "{{ __journal_start_time }}" --no-pager |
              grep -v " Invoked with" |
              grep "sr_fingerprint.*role_name=trustee_server"
          register: __register_journal_fingerprints
          changed_when: false
          when: __register_dev_log.stat.exists

        - name: Check that the log file was written
          ansible.builtin.slurp:
            path: /var/log/sysroles.jsonl
          register: __register_log_file

        - name: Verify log file and journal fingerprints
          when: __register_dev_log.stat.exists
          vars:
            __journal_lines: "{{ __register_journal_fingerprints.stdout_lines }}"
            __journal_begin: "{{ __journal_lines | select('search', 'status=begin') | list }}"
            __journal_success: "{{ __journal_lines | select('search', 'status=success') | list }}"
            __begin_date: "{{ (__journal_begin[0] | regex_search('date=([^ ]+)', '\\1'))[0] }}"
            __success_date: "{{ (__journal_success[0] | regex_search('date=([^ ]+)', '\\1'))[0] }}"
            __file_content: "{{ __register_log_file.content | b64decode }}"
          block:
            - name: Print contents of logs
              debug:
                var: item
              loop:
                - "{{ __file_content }}"
                - "{{ __journal_lines }}"

            - name: Assert content is correct
              ansible.builtin.assert:
                that:
                  - __journal_begin | length > 0
                  - __journal_success | length > 0
                  - __begin_date in __file_content
                  - __success_date in __file_content

        - name: Flush handlers to start services
          ansible.builtin.meta: flush_handlers

        - name: Gather package facts
          ansible.builtin.package_facts:

        - name: Assert required packages are installed
          ansible.builtin.assert:
            that: item in ansible_facts.packages
            fail_msg: "Required package {{ item }} is not installed"
          loop: "{{ __trustee_server_trustee_packages }}"

        - name: Check trustee quadlet install directory exists
          ansible.builtin.stat:
            path: "{{ __trustee_server_quadlet_install_dir }}"
          register: quadlet_dir

        - name: Assert quadlet directory exists
          ansible.builtin.assert:
            that: quadlet_dir.stat.exists
            fail_msg: "Quadlet install directory {{ __trustee_server_quadlet_install_dir }} was not created"

        - name: Find quadlet files in install directory
          ansible.builtin.find:
            paths: "{{ __trustee_server_quadlet_install_dir }}"
            patterns:
              - "*.container"
              - "*.volume"
              - "*.network"
              - "*.pod"
            recurse: false
          register: quadlet_files

        - name: Assert quadlet files exist
          ansible.builtin.assert:
            that: quadlet_files.matched | int > 0
            fail_msg: "No quadlet files found in {{ __trustee_server_quadlet_install_dir }}"

        - name: Check trustee certificates and keys were generated
          ansible.builtin.stat:
            path: "{{ item }}"
          register: trustee_certs
          loop:
            - "{{ __trustee_server_config_dir }}/kbs/server.key"
            - "{{ __trustee_server_config_dir }}/kbs/server.crt"
            - "{{ __trustee_server_config_dir }}/kbs/auth.key"
            - "{{ __trustee_server_config_dir }}/kbs/auth.pub"
            - "{{ __trustee_server_config_dir }}/as/token.key"
            - "{{ __trustee_server_config_dir }}/as/token.crt"
            - "{{ __trustee_server_config_dir }}/kbs/trusted_certs/token0.crt"

        - name: Assert trustee certificates and keys exist
          ansible.builtin.assert:
            that: item.stat.exists
            fail_msg: "Trustee cert/key {{ item.item }} was not generated"
          loop: "{{ trustee_certs.results }}"

        - name: Find trustee pod file
          ansible.builtin.find:
            paths: "{{ __trustee_server_quadlet_install_dir }}"
            patterns: "*.pod"
            recurse: false
          register: trustee_pod_files

        - name: Check trustee pod service is running
          ansible.builtin.service:
            name: "{{ (trustee_pod_files.files[0].path | basename) | replace('.pod', '') }}-pod"
            state: started
          check_mode: true
      always:
        - name: Run test cleanup
          ansible.builtin.include_tasks: tasks/cleanup.yml
          tags:
            - tests::cleanup
