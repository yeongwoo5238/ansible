---
- name: Restore Demo Web
  hosts: localhost
  tasks:
    # 1) 방화벽 포트 제거
    # * http, https
    - name: 1) 방화벽 포트 제거
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: disabled
      loop:
        - http
        - https

    # 2) 서비스 종료
    # * httpd
    - name: 2) 서비스 종료
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - httpd

    # 3) 서비스 설정 삭제
    # * /var/www/html/index.html 파일 삭제
    - name: 3) 서비스 설정 삭제
      ansible.builtin.file:
        path: /var/www/html/index.html
        state: absent

    # 4) 패키지 삭제
    # * httpd, mod_ssl
    - name: 4) 패키지 삭제
      ansible.builtin.dnf:
        name:
          - httpd
          - mod_ssl
        state: absent
